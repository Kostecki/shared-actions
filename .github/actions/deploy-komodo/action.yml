name: Deploy via Komodo
description: Connects via Tailscale and triggers a Komodo stack update

inputs:
  ts-oauth-client-id:
    required: true
    description: The OAuth client ID for Tailscale authentication
  ts-host:
    required: true
    description: The hostname or IP address of the target machine running the Komodo
      stack. For ping and API access.
  komodo-port:
    required: true
    description: The port on which the Komodo API is listening
  komodo-api-key:
    required: true
    description: The API key for authenticating with the Komodo API
  komodo-api-secret:
    required: true
    description: The API secret for authenticating with the Komodo API
  komodo-stack-id:
    required: true
    description: The ID of the Komodo stack to update

runs:
  using: composite
  steps:
    - name: Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        audience: api.tailscale.com/${{ inputs.ts-oauth-client-id }}
        tags: tag:ci
        ping: ${{ inputs.ts-host }}

    - name: Trigger Komodo stack update
      shell: bash
      env:
        KOMODO_URL: http://${{ inputs.ts-host }}:${{ inputs.komodo-port }}
        KOMODO_KEY: ${{ inputs.komodo-api-key }}
        KOMODO_SECRET: ${{ inputs.komodo-api-secret }}
        STACK: ${{ inputs.komodo-stack-id }}
      run: |
        komodo() {
          curl -fsS -X POST "$KOMODO_URL/$1" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $KOMODO_KEY" \
            -H "X-API-Secret: $KOMODO_SECRET" \
            -d "$2"
        }

        # New images: redeploys only the services whose image changed
        komodo write/CheckStackForUpdate "{\"stack\": \"$STACK\", \"wait_for_auto_update\": true}" > /dev/null

        # Compose changes: CheckStackForUpdate ignores them, so redeploy
        # (docker compose up) when the repo's files differ from what's deployed
        update_id=$(komodo execute/DeployStackIfChanged "{\"stack\": \"$STACK\"}" | jq -r '._id["$oid"]')
        for _ in $(seq 1 60); do
          update=$(komodo read/GetUpdate "{\"id\": \"$update_id\"}")
          if [ "$(jq -r .status <<< "$update")" = "Complete" ]; then
            jq -r '.logs[] | "\(.stage): \(.stdout // "")\(.stderr // "")"' <<< "$update"
            [ "$(jq -r .success <<< "$update")" = "true" ] || { echo "Komodo deploy failed"; exit 1; }
            exit 0
          fi
          sleep 5
        done
        echo "Timed out waiting for Komodo update $update_id"
        exit 1
